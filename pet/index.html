<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:; connect-src 'none'">
<title>DeepSeek Pet</title>
<link rel="stylesheet" href="pet.css">
</head>
<body>
<div id="stage" data-mode="perch">
  <canvas id="pet" width="380" height="300"></canvas>

  <div id="bubble" class="bubble" hidden>
    <span class="bubble-text"></span>
    <button class="bubble-jump" hidden title="跳到这个对话">去</button>
  </div>

  <div id="status-card" class="panel card" hidden>
    <div class="card-head">
      <div class="card-title"><span id="card-name">小鲸鱼</span><span class="card-sub" id="card-sub">DeepSeek 的小鲸鱼</span></div>
      <button class="icon-btn" id="card-close" title="关闭">×</button>
    </div>
    <div class="bars" id="card-bars"></div>
    <div class="card-meta">
      <span id="card-days">在一起 0 天</span>
      <span id="card-tokens">吃掉 0 token</span>
    </div>
    <div class="card-actions">
      <button data-action="diary">日记</button>
      <button data-action="recall">回窗口</button>
      <button data-action="settings">设置</button>
    </div>
  </div>

  <div id="menu" class="panel menu" hidden></div>

  <div id="postcard" class="panel postcard" hidden></div>

  <div id="diary" class="panel diary" hidden></div>

  <div id="settings" class="panel settings" hidden>
    <div class="card-head">
      <div class="card-title">桌面宠物</div>
      <button class="icon-btn" id="settings-close" title="关闭">×</button>
    </div>
    <div class="settings-body">
      <label class="switch-row">
        <span>启用桌面宠物</span>
        <button class="switch" id="opt-enabled" role="switch" aria-checked="true"><span></span></button>
      </label>
      <div class="field">
        <span class="field-label">宠物角色</span>
        <div class="seg" id="opt-character">
          <button data-value="whale">小鲸鱼</button>
          <button data-value="crab">小螃蟹</button>
        </div>
      </div>
      <div class="field">
        <span class="field-label">大小</span>
        <div class="seg" id="opt-size"></div>
      </div>
      <div class="field">
        <span class="field-label">配色</span>
        <div class="seg seg-skin" id="opt-skin"></div>
      </div>
      <label class="switch-row">
        <span>到点提醒（系统通知）</span>
        <button class="switch" id="opt-notify" role="switch" aria-checked="true"><span></span></button>
      </label>
      <label class="switch-row">
        <span>被摸时冒爱心</span>
        <button class="switch" id="opt-hearts" role="switch" aria-checked="true"><span></span></button>
      </label>
      <p class="hint">关掉后不创建宠物窗口，也不跑任何宠物代码。</p>
      <div class="settings-actions">
        <button id="opt-reset">重置宠物数据</button>
      </div>
    </div>
  </div>

  <div id="toast" class="bubble toast" hidden></div>
  <div id="debug" hidden></div>
</div>
<script type="module" src="pet.js"></script>
</body>
</html>
